name: Publish
on:
  push:
    tags:
      - v*
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: crates
    name: Publish
    steps:
      - uses: holepunchto/actions/rust-base@v1
      - uses: holepunchto/actions/publish-crates@v1
